# Словарь написаний ролей: вариант → название, которое используется в расчётах.
#
# Варианты, которые отличаются только регистром, пробелами, «_», дефисами,
# точками или «ё», сводятся автоматически (src/normalizer.py, role_key):
# «Дев_опс», «Дев опс», «ДевОпс» — одна роль. Сюда нужно вписывать только
# разные слова для одной роли и выбор основного написания группы.
roles:
  "ДевОпс": "Девопс"
  "Разработчик iOS": "Разработчик IOS"
  "Разработчик BigData": "Разработчик Big Data"
